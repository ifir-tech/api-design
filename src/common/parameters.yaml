PaginationLimit:
  name: limit
  in: query
  description: Number of items to return per page
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 10

PaginationPage:
  name: page
  in: query
  description: Page number for pagination
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1
