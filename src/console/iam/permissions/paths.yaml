/permissions:
  get:
    operationId: listPermissions
    tags:
      - Permissions
    summary: List all permissions
    description: Returns a list of all permissions in the system.
    responses:
      '200':
        description: List of permissions
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/PermissionListResponse'
/permissions/create:
  post:
    operationId: createPermission
    tags:
      - Permissions
    summary: Create a permission
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreatePermissionRequest'
    responses:
      '201':
        description: Permission created
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/Permission'

/permissions/{permissionId}:
  get:
    operationId: getPermission
    tags:
      - Permissions
    summary: Get a permission
    parameters:
      - name: permissionId
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Permission details
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/Permission'
  put:
    operationId: updatePermission
    tags:
      - Permissions
    summary: Update a permission
    parameters:
      - name: permissionId
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdatePermissionRequest'
    responses:
      '200':
        description: Permission updated
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/Permission'
  delete:
    operationId: deletePermission
    tags:
      - Permissions
    summary: Delete a permission
    parameters:
      - name: permissionId
        in: path
        required: true
        schema:
          type: integer
    responses:
      '204':
        description: Permission deleted

/roles/{roleId}/permissions:
  get:
    operationId: listRolePermissions
    tags:
      - Permissions
    summary: List permissions of a role
    description: Returns all permissions assigned to a specific role.
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: List of role permissions
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/PermissionListResponse'
      '404':
        description: Role not found
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'
/roles/{roleId}/permissions/{permissionId}:
  post:
    operationId: addRolePermission
    tags:
      - Permissions
    summary: Add permission to role
    description: Assigns a permission to a role.
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
      - name: permissionId
        in: path
        required: true
        schema:
          type: integer
    responses:
      '201':
        description: Permission added to role
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/Permission'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'
  delete:
    operationId: removeRolePermission
    tags:
      - Permissions
    summary: Remove permission from role
    description: Removes a permission from a role.
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
      - name: permissionId
        in: path
        required: true
        schema:
          type: integer
    responses:
      '204':
        description: Permission removed from role
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'
