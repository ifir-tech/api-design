Permission:
  type: object
  properties:
    id:
      type: integer
      example: 1
    action:
      type: string
      example: "export"
    resource:
      type: string
      example: "payments"
    description:
      type: string
      example: "Can export payments"

PermissionListResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/Permission'

CreatePermissionRequest:
  type: object
  required:
    - action
    - resource
  properties:
    action:
      type: string
      example: "export"
    resource:
      type: string
      example: "payments"
    description:
      type: string
      example: "Can export payments"

UpdatePermissionRequest:
  type: object
  properties:
    description:
      type: string
      example: "Updated description"

AddRolePermissionRequest:
  type: object
  required:
    - permissionId
  properties:
    permissionId:
      type: integer
      example: 1
