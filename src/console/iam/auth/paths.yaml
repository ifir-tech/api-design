/auth/login:
  post:
    operationId: login
    tags:
      - Auth
    summary: Login user
    description: Authenticates a user and returns an access token.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/LoginRequest'
    responses:
      '200':
        description: Successfully logged in
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/LoginResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'

/auth/refresh-token:
  post:
    operationId: refreshToken
    tags:
      - Auth
    summary: Refresh session token
    description: Uses a refresh token to obtain a new access token.
    security: []
    parameters:
      - name: x-refresh-token
        in: header
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Tokens successfully refreshed
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/RefreshTokenResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'


/auth/validate-token:
  post:
    operationId: validateToken
    tags:
      - Auth
    summary: Validate session token
    description: Validates a token and returns validity with associated user ID.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/ValidateTokenRequest'
    responses:
      '200':
        description: Validation result
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/ValidateTokenResponse'

/auth/logout:
  post:
    operationId: logout
    tags:
      - Auth
    summary: Logout user
    description: Invalidates the current session token.
    parameters:
      - name: x-refresh-token
        in: header
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Successfully logged out
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/GenericSuccessResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'

/auth/update-password:
  put:
    operationId: updatePassword
    tags:
      - Auth
    summary: Update password
    description: Updates the logged-in user's password.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdatePasswordRequest'
    responses:
      '200':
        description: Password successfully updated
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/GenericSuccessResponse'
      '400':
        description: Bad Request (e.g., incorrect old password)
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'

/auth/forgot-password:
  post:
    operationId: forgotPassword
    tags:
      - Auth
    summary: Request password reset
    description: Generates a password reset token and sends it via email or SMS.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/ForgotPasswordRequest'
    responses:
      '200':
        description: Reset token sent successfully (if account exists)
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/GenericSuccessResponse'

/auth/reset-password:
  get:
    operationId: resetPassword
    tags:
      - Auth
    summary: Reset password
    description: Resets the password using a valid token.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/ResetPasswordRequest'
    responses:
      '200':
        description: Password successfully reset
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/GenericSuccessResponse'
      '400':
        description: Bad Request (e.g., invalid or expired token)
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'
