LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      example: "admin@epc-al-anifiyat.com"
    password:
      type: string
      format: password
      example: "strongPassword123"

LoginResponse:
  type: object
  properties:
    access_token:
      type: string
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    refresh_token:
      type: string
      example: "def456..."
    user:
      $ref: '../../../common/schemas.yaml#/User'

RefreshTokenRequest:
  type: object
  required:
    - refresh_token
  properties:
    refresh_token:
      type: string
      example: "def456..."

RefreshTokenResponse:
  type: object
  properties:
    access_token:
      type: string
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    refresh_token:
      type: string
      example: "def456..."

ValidateTokenRequest:
  type: object
  required:
    - token
  properties:
    token:
      type: string
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

ValidateTokenResponse:
  type: object
  properties:
    is_valid:
      type: boolean
      example: true
    user_id:
      type: integer
      example: 1

UpdatePasswordRequest:
  type: object
  required:
    - current_password
    - new_password
  properties:
    current_password:
      type: string
      format: password
      example: "oldPass123"
    new_password:
      type: string
      format: password
      example: "newPass456"

ForgotPasswordRequest:
  type: object
  required:
    - email
  properties:
    email:
      type: string
      format: email
      example: "admin@epc-al-anifiyat.com"

ResetPasswordRequest:
  type: object
  required:
    - token
    - new_password
  properties:
    token:
      type: string
      example: "reset-token-xyz..."
    new_password:
      type: string
      format: password
      example: "newPass456"

GenericSuccessResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    message:
      type: string
      example: "Operation successful"
