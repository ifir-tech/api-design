/roles:
  get:
    operationId: listRoles
    security:
      - bearerAuth: []
    tags:
      - Roles
    summary: List roles
    description: Returns a list of available roles.
    responses:
      '200':
        description: List of roles
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/RoleListResponse'
/roles/create:
  post:
    operationId: createRole
    security:
      - bearerAuth: []
    tags:
      - Roles
    summary: Create a role
    description: Creates a new role.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateRoleRequest'
    responses:
      '201':
        description: Role created
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/Role'

/roles/{id}:
  get:
    operationId: getRole
    security:
      - bearerAuth: []
    tags:
      - Roles
    summary: Get a role
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Role details
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/Role'
      '404':
        description: Role not found
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'
  put:
    operationId: updateRole
    security:
      - bearerAuth: []
    tags:
      - Roles
    summary: Update a role
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/UpdateRoleRequest'
    responses:
      '200':
        description: Role updated
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/Role'
  delete:
    operationId: deleteRole
    security:
      - bearerAuth: []
    tags:
      - Roles
    summary: Delete a role
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      '204':
        description: Role deleted
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'
