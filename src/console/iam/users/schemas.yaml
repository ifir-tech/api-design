CreateUserRequest:
  type: object
  required:
    - roleId
    - email
    - password
    - firstName
    - lastName
  properties:
    roleId:
      type: integer
      example: 2
    email:
      type: string
      format: email
      example: "new.user@example.com"
    password:
      type: string
      format: password
      example: "securePass456"
    firstName:
      type: string
      example: "John"
    lastName:
      type: string
      example: "Smith"

UpdateUserRequest:
  type: object
  properties:
    roleId:
      type: integer
      example: 2
    email:
      type: string
      format: email
    firstName:
      type: string
      example: "John"
    lastName:
      type: string
      example: "Smith"

UserListResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '../../../common/schemas.yaml#/User'
    meta:
      $ref: '../../../common/schemas.yaml#/PaginationMeta'
