TuitionFee:
  type: object
  properties:
    id:
      type: integer
      example: 1
    classroomId:
      type: integer
      example: 2
    academicYearId:
      type: integer
      example: 3
    streamId:
      type: integer
      example: 1
    dueDate:
      type: string
      format: date-time
      example: "2026-10-01T00:00:00Z"
    amount:
      type: integer
      example: 500000
    name:
      type: string
      example: "Frais de scolarité CM1"

CreateTuitionFeeRequest:
  type: object
  required:
    - classroomId
    - academicYearId
    - streamId
    - amount
    - name
    - dueDate
  properties:
    classroomId:
      type: integer
      example: 2
    academicYearId:
      type: integer
      example: 3
    streamId:
      type: integer
      example: 1
    dueDate:
      type: string
      format: date-time
      example: "2026-10-01T00:00:00Z"
    amount:
      type: integer
      example: 500000
    name:
      type: string
      example: "Frais de scolarité CM1"

TuitionFeeListResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/TuitionFee'
