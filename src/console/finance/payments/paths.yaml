/finance/payments:
  get:
    operationId: listPayments
    tags:
      - Payments
    summary: List all payments
    description: Returns a paginated list of all payments.
    parameters:
      - $ref: '../../../common/parameters.yaml#/PaginationLimit'
      - $ref: '../../../common/parameters.yaml#/PaginationPage'
      - name: start_date
        in: query
        required: false
        description: Filter payments after or on this date
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        description: Filter payments before or on this date
        schema:
          type: string
          format: date
    responses:
      '200':
        description: List of payments
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/PaymentListResponse'
/finance/payments/create:
  post:
    operationId: recordPayment
    tags:
      - Payments
    summary: Record a tuition payment
    description: Records a payment made by a student.
    parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key to prevent double charging
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/RecordPaymentRequest'
    responses:
      '201':
        description: Payment recorded
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/Payment'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'

/finance/payments/{id}:
  get:
    operationId: getPayment
    tags:
      - Payments
    summary: Get payment details
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Payment details
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/Payment'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'

/finance/students/{studentId}/payments:
  get:
    operationId: getStudentPayments
    tags:
      - Payments
    summary: Get student payments
    description: Retrieves all payments for a specific student.
    parameters:
      - name: studentId
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: List of student payments
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/GetStudentPaymentsResponse'

/finance/students/{studentId}/balance:
  get:
    operationId: getStudentBalance
    tags:
      - Payments
    summary: Get student tuition balance details
    description: Returns total amount due, amount paid, remaining balance, and status.
    parameters:
      - name: studentId
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Student balance details
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/StudentBalanceResponse'
      '404':
        description: Student not found
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'

/finance/students/balances:
  get:
    operationId: listStudentsBalances
    tags:
      - Payments
    summary: List student balances
    description: Returns a list of student balances filtered by classroom, year, and status.
    parameters:
      - $ref: '../../../common/parameters.yaml#/PaginationLimit'
      - $ref: '../../../common/parameters.yaml#/PaginationPage'
      - name: classroom_id
        in: query
        required: false
        schema:
          type: integer
      - name: academic_year_id
        in: query
        required: false
        schema:
          type: integer
      - name: payment_status
        in: query
        required: false
        schema:
          type: string
          enum: [PAID, PARTIAL, UNPAID, OVERDUE]
    responses:
      '200':
        description: Paginated list of student balances
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/StudentBalancesListResponse'
