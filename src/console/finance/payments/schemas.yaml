RecordPaymentRequest:
  type: object
  required:
    - studentId
    - amount
    - method
    - date
  properties:
    studentId:
      type: integer
      example: 12
    tuitionFeeId:
      type: integer
      example: 2
    cash_register_id:
      type: integer
      nullable: true
      example: 1
    recorded_by_id:
      type: integer
      nullable: true
      example: 3
    amount:
      type: integer
      example: 150000
    method:
      type: string
      example: "CASH"
    date:
      type: string
      format: date-time
      example: "2026-07-26T00:00:00Z"

GetStudentPaymentsResponse:
  type: object
  properties:
    payments:
      type: array
      items:
        $ref: '../../../common/schemas.yaml#/Payment'

PaymentListResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '../../../common/schemas.yaml#/Payment'
    meta:
      $ref: '../../../common/schemas.yaml#/PaginationMeta'

StudentBalanceResponse:
  type: object
  properties:
    studentId:
      type: integer
      example: 12
    amountDue:
      type: integer
      example: 500000
    amountPaid:
      type: integer
      example: 350000
    amountRemaining:
      type: integer
      example: 150000
    status:
      type: string
      enum: [PAID, PARTIAL, UNPAID, OVERDUE]
      example: "PARTIAL"

StudentBalanceItem:
  type: object
  properties:
    student:
      $ref: '../../../common/schemas.yaml#/Student'
    balance:
      $ref: '#/StudentBalanceResponse'

StudentBalancesListResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/StudentBalanceItem'
    meta:
      $ref: '../../../common/schemas.yaml#/PaginationMeta'
