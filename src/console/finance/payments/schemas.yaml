RecordPaymentRequest:
  type: object
  required:
    - student_id
    - tuition_fee_id
    - amount
    - payment_method
    - payment_date
  properties:
    student_id:
      type: integer
      example: 12
    tuition_fee_id:
      type: integer
      example: 2
    cash_register_id:
      type: integer
      nullable: true
      example: 1
    recorded_by_id:
      type: integer
      nullable: true
      example: 3
    amount:
      type: integer
      example: 150000
    payment_method:
      type: string
      example: "CASH"
    payment_date:
      type: string
      format: date
      example: "2026-07-11"

GetStudentPaymentsResponse:
  type: object
  properties:
    payments:
      type: array
      items:
        $ref: '../../../common/schemas.yaml#/Payment'

PaymentListResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '../../../common/schemas.yaml#/Payment'
    meta:
      $ref: '../../../common/schemas.yaml#/PaginationMeta'

StudentBalanceResponse:
  type: object
  properties:
    student_id:
      type: integer
      example: 12
    amount_due:
      type: integer
      example: 500000
    amount_paid:
      type: integer
      example: 350000
    amount_remaining:
      type: integer
      example: 150000
    status:
      type: string
      enum: [PAID, PARTIAL, UNPAID, OVERDUE]
      example: "PARTIAL"

StudentBalanceItem:
  type: object
  properties:
    student:
      $ref: '../../../common/schemas.yaml#/Student'
    balance:
      $ref: '#/StudentBalanceResponse'

StudentBalancesListResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/StudentBalanceItem'
    meta:
      $ref: '../../../common/schemas.yaml#/PaginationMeta'
