RecordExpenseRequest:
  type: object
  required:
    - categoryId
    - description
    - amount
    - date
  properties:
    categoryId:
      type: integer
      example: 4
    cashRegisterId:
      type: integer
      nullable: true
      example: 1
    recordedById:
      type: integer
      nullable: true
      example: 3
    description:
      type: string
      example: "Paid internet bill"
    amount:
      type: number
      format: double
      example: 85.50
    date:
      type: string
      format: date-time
      example: "2026-07-26T00:00:00Z"

ExpenseListResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '../../../common/schemas.yaml#/Expense'
    meta:
      $ref: '../../../common/schemas.yaml#/PaginationMeta'
