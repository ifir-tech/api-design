/finance/expense-categories:
  get:
    operationId: listExpenseCategories
    tags:
      - Expenses
    summary: List expense categories
    responses:
      '200':
        description: List of expense categories
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/ExpenseCategoryListResponse'
/finance/expense-categories/create:
  post:
    operationId: createExpenseCategory
    tags:
      - Expenses
    summary: Create expense category
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CreateExpenseCategoryRequest'
    responses:
      '201':
        description: Category created
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/ExpenseCategory'
