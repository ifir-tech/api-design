ClassroomListResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '../../../common/schemas.yaml#/Classroom'
    meta:
      $ref: '../../../common/schemas.yaml#/PaginationMeta'

CreateClassroomRequest:
  type: object
  required:
    - name
    - levelId
    - capacity
  properties:
    name:
      type: string
      example: "6ème A"
    levelId:
      type: integer
      example: 1
    capacity:
      type: integer
      example: 30

UpdateClassroomRequest:
  type: object
  properties:
    name:
      type: string
      example: "6ème A"
    levelId:
      type: integer
      example: 1
    capacity:
      type: integer
      example: 30
