AcademicYearListResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '../../../common/schemas.yaml#/AcademicYear'

CreateAcademicYearRequest:
  type: object
  required:
    - name
    - startDate
    - endDate
  properties:
    name:
      type: string
      example: "2026-2027"
    startDate:
      type: string
      format: date-time
      example: "2026-09-01T00:00:00Z"
    endDate:
      type: string
      format: date-time
      example: "2027-06-30T00:00:00Z"

UpdateAcademicYearRequest:
  type: object
  properties:
    name:
      type: string
      example: "2026-2027"
    startDate:
      type: string
      format: date-time
      example: "2026-09-01T00:00:00Z"
    endDate:
      type: string
      format: date-time
      example: "2027-06-30T00:00:00Z"

ToggleAcademicYearRequest:
  type: object
  required:
    - isActive
  properties:
    isActive:
      type: boolean
      example: true
