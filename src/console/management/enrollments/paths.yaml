/management/enrollments:
  get:
    operationId: listEnrollments
    security:
      - bearerAuth: []
    tags:
      - Enrollments
    summary: List all enrollments
    description: Returns a paginated list of enrollments, with optional filters.
    parameters:
      - $ref: '../../../common/parameters.yaml#/PaginationLimit'
      - $ref: '../../../common/parameters.yaml#/PaginationPage'
      - name: classroom_id
        in: query
        required: false
        description: Filter by classroom ID
        schema:
          type: integer
      - name: academic_year_id
        in: query
        required: false
        description: Filter by academic year ID
        schema:
          type: integer
      - name: student_id
        in: query
        required: false
        description: Filter by student ID
        schema:
          type: integer
      - name: section
        in: query
        required: false
        description: Filter by section (FR or AR)
        schema:
          type: string
          enum: [FR, AR]
    responses:
      '200':
        description: List of enrollments
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/EnrollmentListResponse'
/management/enrollments/create:
  post:
    operationId: enrollStudent
    security:
      - bearerAuth: []
    tags:
      - Enrollments
    summary: Enroll a student
    description: Assigns a student to a classroom for an academic year.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/EnrollStudentRequest'
    responses:
      '201':
        description: Student enrolled
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/Enrollment'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'
