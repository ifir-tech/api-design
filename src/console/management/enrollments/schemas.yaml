EnrollStudentRequest:
  type: object
  required:
    - studentMatricule
    - academicYearId
    - classroomId
    - stream
  properties:
    studentMatricule:
      type: string
      example: "2024-0001"
    academicYearId:
      type: integer
      example: 2
    classroomId:
      type: integer
      example: 5
    stream:
      type: string
      example: "Francophone"

EnrollmentListResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '../../../common/schemas.yaml#/Enrollment'
    meta:
      $ref: '../../../common/schemas.yaml#/PaginationMeta'
