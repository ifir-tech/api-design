/management/students:
  get:
    operationId: listStudents
    security:
      - bearerAuth: []
    tags:
      - Students
    summary: List all students
    description: Returns a paginated list of students.
    parameters:
      - $ref: '../../../common/parameters.yaml#/PaginationLimit'
      - $ref: '../../../common/parameters.yaml#/PaginationPage'
      - name: search
        in: query
        required: false
        description: Search by name, first name or matricule
        schema:
          type: string
      - name: classroom_id
        in: query
        required: false
        description: Filter by classroom ID
        schema:
          type: integer
      - name: level_id
        in: query
        required: false
        description: Filter by level ID
        schema:
          type: integer
      - name: status
        in: query
        required: false
        description: Filter by active status
        schema:
          type: string
          enum: [ACTIVE, INACTIVE]
    responses:
      '200':
        description: List of students
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../../common/schemas.yaml#/Student'
                meta:
                  $ref: '../../../common/schemas.yaml#/PaginationMeta'
  post:
    operationId: registerStudent
    security:
      - bearerAuth: []
    tags:
      - Students
    summary: Register a new student
    description: Registers a student in the system (creates profile).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/RegisterStudentRequest'
    responses:
      '201':
        description: Student registered
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/Student'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'

/management/students/{matricule}:
  get:
    operationId: getStudent
    security:
      - bearerAuth: []
    tags:
      - Students
    summary: Get student details
    parameters:
      - name: matricule
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Student details
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/Student'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'

/management/students/{matricule}/toggle:
  patch:
    operationId: toggleStudentStatus
    security:
      - bearerAuth: []
    tags:
      - Students
    summary: Toggle student active status
    description: Activates or deactivates a student profile.
    parameters:
      - name: matricule
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Student status toggled
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/Student'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'

/management/students/{matricule}/absences:
  get:
    operationId: getStudentAbsences
    security:
      - bearerAuth: []
    tags:
      - Absences
    summary: Get student absences
    description: Retrieves all recorded absences for a student.
    parameters:
      - name: matricule
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: List of absences
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../../common/schemas.yaml#/Absence'

/management/students/{matricule}/absences/{absenceId}:
  delete:
    operationId: deleteAbsence
    security:
      - bearerAuth: []
    tags:
      - Absences
    summary: Delete student absence
    description: Removes an absence record.
    parameters:
      - name: matricule
        in: path
        required: true
        schema:
          type: integer
      - name: absenceId
        in: path
        required: true
        schema:
          type: integer
    responses:
      '204':
        description: Absence deleted
      '400':
        description: Bad Request (Absence does not belong to student)
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../../../common/schemas.yaml#/ErrorResponse'

/management/students/{matricule}/payments:
  get:
    operationId: getStudentPaymentsHistory
    security:
      - bearerAuth: []
    tags:
      - Payments
    summary: Get student payments history
    description: Retrieves payment history for a student from Management context.
    parameters:
      - name: matricule
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: List of payments
        content:
          application/json:
            schema:
              type: object
              properties:
                payments:
                  type: array
                  items:
                    $ref: '../../../common/schemas.yaml#/Payment'
