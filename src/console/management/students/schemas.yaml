RegisterStudentRequest:
  type: object
  required:
    - firstName
    - lastName
    - birthDate
    - gender
    - fatherName
    - fatherPhone
    - motherName
    - motherPhone
    - birthPlace
  properties:
    firstName:
      type: string
      example: "John"
    lastName:
      type: string
      example: "Doe"
    birthDate:
      type: string
      format: date
      example: "2010-05-15"
    gender:
      type: string
      enum: [MALE, FEMALE]
      example: "MALE"
    email:
      type: string
      example: "john.doe@example.com"
    parentEmail:
      type: string
      example: "parent@example.com"
    parentPhone:
      type: string
      example: "+213612345678"
    photo:
      type: string
      format: uri
      nullable: true
      example: "https://fichiers.alanifiyat.com/photo-test.jpg"
    fatherName:
      type: string
      example: "Doe Senior"
    fatherProfession:
      type: string
      example: "Ingénieur"
    fatherPhone:
      type: string
      example: "+213612345678"
    motherName:
      type: string
      example: "Jane Doe"
    motherProfession:
      type: string
      example: "Enseignante"
    motherPhone:
      type: string
      example: "+213612345679"
    birthPlace:
      type: string
      example: "Alger"
    address:
      type: string
      example: "123 Rue de l'Indépendance, Alger"
    isNewStudent:
      type: boolean
      example: true
    hasBirthCertificate:
      type: boolean
      example: true
    hasPhotos:
      type: boolean
      example: true
    hasPreviousSchoolCertificate:
      type: boolean
      example: false
