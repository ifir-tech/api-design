RegisterStudentRequest:
  type: object
  required:
    - first_name
    - last_name
    - date_of_birth
    - gender
    - father_name
    - father_phone
    - mother_name
    - mother_phone
    - birth_place
  properties:
    first_name:
      type: string
      example: "Alice"
    last_name:
      type: string
      example: "Dupont"
    date_of_birth:
      type: string
      format: date
      example: "2015-05-14"
    gender:
      type: string
      enum: [MALE, FEMALE]
      example: "FEMALE"
    father_name:
      type: string
      example: "Jean Dupont"
    father_phone:
      type: string
      example: "+221771234567"
    mother_name:
      type: string
      example: "Marie Dupont"
    mother_phone:
      type: string
      example: "+221777654321"
    birth_place:
      type: string
      example: "Dakar"
    photo:
      type: string
      format: uri
      nullable: true
      example: "https://example.com/photos/alice.jpg"
