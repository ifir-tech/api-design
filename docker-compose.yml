services:
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    ports:
      - '${SWAGGER_UI_FORWARD_PORT:-8080}:8080'
    environment:
      URLS: >-
        [
           { url: "http://localhost:8080/specs/console/openapi.yaml", name: "Console" }
        ]
    volumes:
      - ./src/console:/usr/share/nginx/html/specs/console:ro
      - ./src/common:/usr/share/nginx/html/specs/common:ro

  console:
    platform: linux/amd64
    image: stoplight/prism:4
    container_name: console
    command: mock --cors --no-validate-request -h 0.0.0.0 /specs/console/openapi.yaml
    ports:
      - '${CONSOLE_FORWARD_PORT:-4010}:4010'
    volumes:
      - ./src:/specs:ro
